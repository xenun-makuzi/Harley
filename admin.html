<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#15161a; --surface:#1e1f24; --surface-2:#26282e; --surface-3:#303239;
  --border:#383a42; --border-light:#46484f;
  --text:#edeef0; --text-dim:#9b9da6; --text-faint:#6d6f78;
  --accent:#5c7ea8; --accent-light:#7996b8; --accent-bg:rgba(92,126,168,.14);
  --brass:#c68a4e; --brass-dark:#a86f3a; --brass-light:#dba572;
  --success:#7fa876; --success-bg:rgba(127,168,118,.14);
  --danger:#c1493c; --danger-bg:rgba(193,73,60,.14);
  --warn:#c6963f; --warn-bg:rgba(198,150,63,.14);
  --radius:3px; --radius-lg:5px;
  --font-display:'Big Shoulders',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --sidebar-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:.01em;line-height:1;}
.mono{font-family:var(--font-mono);}
:focus-visible{outline:2px solid var(--brass-light);outline-offset:2px;}

/* ---------- LOGIN ---------- */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px;}
.login-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:20px;text-transform:uppercase;margin-bottom:6px;}
.login-card .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:24px;}
.login-error{background:var(--danger-bg);color:var(--danger);border-radius:var(--radius);padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;}
.login-error.show{display:block;}

/* ---------- SHARED FORM ELEMENTS ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border-light);color:var(--text);
  padding:10px 12px;border-radius:var(--radius);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);}
.field textarea{resize:vertical;min-height:80px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-check{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.field-check input{width:16px;height:16px;accent-color:var(--brass);}
.field-check label{font-family:var(--font-body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--text);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-light);background:var(--surface-2);color:var(--text);padding:10px 18px;border-radius:var(--radius);font-weight:600;font-size:13.5px;transition:.15s border-color,.15s background;}
.btn:hover{border-color:var(--brass);}
.btn-brass{background:var(--brass);border-color:var(--brass);color:#1a1206;font-weight:700;}
.btn-brass:hover{background:var(--brass-light);border-color:var(--brass-light);}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- SHELL ---------- */
#dashboard-view{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid var(--border);font-family:var(--font-display);font-weight:800;font-size:16px;text-transform:uppercase;}
.sidebar nav{padding:14px 10px;flex:1;}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text-dim);font-size:13.5px;font-weight:600;margin-bottom:2px;}
.side-link:hover{background:var(--surface-2);color:var(--text);}
.side-link.active{background:var(--accent-bg);color:var(--accent-light);}
.side-link svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--border);}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:10;background:rgba(21,22,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:22px;text-transform:uppercase;}
.content{padding:28px;flex:1;}
.admin-logo{
  width:32px;
  height:32px;
  object-fit:contain;
  border-radius:6px;
  flex-shrink:0;
}
/* ---------- STAT CARDS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;}
.stat-card .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}
.stat-card .val{font-family:var(--font-mono);font-size:28px;font-weight:600;color:var(--brass-light);}

/* ---------- CARD / SECTION ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
.panel-head h2{font-size:17px;text-transform:uppercase;}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);padding:11px 20px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 20px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.row-thumb{width:38px;height:38px;border-radius:var(--radius);background:var(--surface-3);overflow:hidden;flex-shrink:0;}
.row-thumb img{width:100%;height:100%;object-fit:cover;}
.name-cell{display:flex;align-items:center;gap:10px;}
.td-actions{display:flex;gap:6px;justify-content:flex-end;}
.table-wrap{overflow-x:auto;}
.empty-row td{text-align:center;color:var(--text-faint);padding:44px 20px;}

/* ---------- BADGE / PILL ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.badge-ok{background:var(--success-bg);color:var(--success);}
.badge-warn{background:var(--warn-bg);color:var(--warn);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-accent{background:var(--accent-bg);color:var(--accent-light);}
.badge-muted{background:var(--surface-3);color:var(--text-faint);}
.toggle{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .track{position:absolute;inset:0;background:var(--surface-3);border:1px solid var(--border-light);border-radius:20px;transition:.15s;}
.toggle .track::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--text-faint);border-radius:50%;transition:.15s;}
.toggle input:checked + .track{background:var(--success-bg);border-color:var(--success);}
.toggle input:checked + .track::before{transform:translateX(16px);background:var(--success);}

/* ---------- MODAL ---------- */
#modal-host{position:fixed;inset:0;z-index:100;display:none;}
#modal-host.show{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,10,12,.7);}
.modal-card{
    position:relative;
    max-width:760px;
    width:min(760px,calc(100% - 40px));
    margin:20px auto;
    background:var(--surface);
    border:1px solid var(--border-light);
    border-radius:var(--radius-lg);
    max-height:calc(100vh - 40px);
    display:flex;
    flex-direction:column;
}

.modal-body{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:22px;
    -webkit-overflow-scrolling:touch;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:18px;text-transform:uppercase;}
.modal-close{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);color:var(--text-faint);}
.modal-close:hover{background:var(--surface-2);color:var(--text);}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
#modal-host{
    position:fixed;
    inset:0;
    display:none;
    overflow-y:auto;
    padding:20px 0;
}

#modal-host{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    overflow-y:auto;
    background:rgba(10,10,12,.75); /* dark overlay */
    backdrop-filter:blur(4px);
    padding:20px;
}

#modal-host.show{
    display:block;
}

.modal-backdrop{
    display:none; /* no longer needed */
}

.modal-card{
    position:relative;
    margin:0 auto;
    max-width:760px;
    width:100%;
    max-height:calc(100vh - 40px);
    display:flex;
    flex-direction:column;
    background:var(--surface); /* fully opaque */
    border:1px solid var(--border-light);
    border-radius:var(--radius-lg);
}

.modal-body{
    flex:1;
    overflow-y:auto;
    background:var(--surface); /* prevents transparency */
    padding:22px;
}
/* ---------- MEDIA MANAGER ---------- */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin:12px 0;}
.media-thumb{position:relative;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);border:1px solid var(--border);}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover;}
.media-thumb .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(10,10,12,.75);color:var(--danger);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;}
.file-drop{border:1px dashed var(--border-light);border-radius:var(--radius);padding:16px;text-align:center;font-size:12.5px;color:var(--text-faint);cursor:pointer;}
.file-drop:hover{border-color:var(--brass);}

/* ---------- FITMENT CHECKLIST ---------- */
.fit-check-grid{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:6px;}
.fit-check-item{display:flex;align-items:center;gap:9px;padding:7px 10px;font-size:13px;border-radius:var(--radius);}
.fit-check-item:hover{background:var(--surface-2);}
.fit-check-item input{width:15px;height:15px;accent-color:var(--brass);flex-shrink:0;}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--brass-light);border-color:var(--brass);}

/* ---------- MISC ---------- */
.empty-hint{text-align:center;padding:50px 20px;color:var(--text-faint);}
.loading-row{text-align:center;padding:50px 20px;color:var(--text-faint);font-family:var(--font-mono);font-size:12.5px;}
.section-note{color:var(--text-faint);font-size:12.5px;margin-bottom:16px;}
.pill-select{display:flex;flex-wrap:wrap;gap:8px;}
.pill-select label{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border-light);padding:8px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;}
.hamburger-admin{display:none;}
#toast-host{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--surface-3);border:1px solid var(--border-light);border-left:3px solid var(--accent);color:var(--text);padding:13px 18px;border-radius:var(--radius);font-size:13.5px;box-shadow:0 10px 24px rgba(0,0,0,.35);min-width:240px;animation:toastIn .18s ease-out;}
.toast.error{border-left-color:var(--danger);}
.toast.success{border-left-color:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:900px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .field-row{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-260px;z-index:80;transition:left .2s;box-shadow:0 0 0 2000px rgba(0,0,0,0);}
  .sidebar.open{left:0;box-shadow:0 0 0 2000px rgba(0,0,0,.5);}
  .hamburger-admin{display:flex;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--surface-2);}
  .content{padding:18px;}
  .topbar{padding:14px 18px;}
}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="login-brand">
  <img src="logo.jpg" class="admin-logo">
  Store Admin
</div>
    <div class="eyebrow">Sign in to manage your store</div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-brass btn-block" type="submit" id="login-btn">Sign In</button>
    </form>
    <p style="margin-top:16px;color:var(--text-faint);font-size:12px;">                  © 2026 Harley Davidson Parts Shop</p>
  </div>
</div>

<div id="dashboard-view">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
  <img src="logo.jpg" class="admin-logo" id="sidebar-logo">
  <span id="side-brand-name">Store Admin</span>
</div>
      <nav id="side-nav"></nav>
      <div class="sidebar-foot">
        <a href="index.html" target="_blank" class="btn btn-block btn-sm" style="margin-bottom:8px;">View Store ↗</a>
        <button class="btn btn-block btn-sm" id="logout-btn">Log Out</button>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:14px;">
          <button class="hamburger-admin" id="sidebar-toggle">☰</button>
          <h1 id="page-title">Overview</h1>
        </div>
        <span class="mono" style="color:var(--text-faint);font-size:12px;" id="admin-email"></span>
      </header>
      <main class="content" id="admin-content"></main>
    </div>
  </div>
</div>

<div id="modal-host"><div class="modal-backdrop" data-action="close-modal"></div><div class="modal-card" id="modal-card"></div></div>
<div id="toast-host"></div>

<script>
/* =========================================================
   CONFIG — same Supabase project as index.html
   ========================================================= */
const SUPABASE_URL = "https://adwuaksfrualchzvfjok.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkd3Vha3NmcnVhbGNoenZmam9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjQ3ODUsImV4cCI6MjEwMDg0MDc4NX0.HBmcDTRZcbiHN7kqWSm_b0p8Hzk8xMEYw87EShhw8yE";
const supabaseC = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   STATE
   ========================================================= */
const state = {
  session:null, view:'overview',
  categories:[], bikeModels:[], products:[], orders:[], paymentMethods:[], storeSettings:{}, newsletter:[],
  loaded:false,
};
const PAYMENT_FIELD_MAP = {
  bank: [['bank_name','Bank Name'],['account_name','Account Name'],['account_number','Account Number'],['routing_number','Routing Number']],
  chime: [['chime_sign','$ChimeSign or Phone']],
  zelle: [['zelle_contact','Zelle Email or Phone']],
  applepay: [['applepay_contact','Apple Pay Contact']],
  cashapp: [['cashtag','$Cashtag']],
  bitcoin: [['wallet_address','BTC Wallet Address'],['network','Network Label']],
};
const STATUS_OPTS = ['pending_payment','payment_review','paid','processing','shipped','delivered','cancelled'];
const STATUS_BADGE = { pending_payment:'warn', payment_review:'accent', paid:'ok', processing:'accent', shipped:'accent', delivered:'ok', cancelled:'danger' };

/* =========================================================
   UTILITIES
   ========================================================= */
function esc(str){ if(str===null||str===undefined) return ''; const d=document.createElement('div'); d.textContent=String(str); return d.innerHTML; }
const moneyFmt = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
function money(n){ return moneyFmt.format(n||0); }
function slugify(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function qs(sel,el){ return (el||document).querySelector(sel); }
function qsa(sel,el){ return Array.from((el||document).querySelectorAll(sel)); }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(d){ return new Date(d).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function toast(msg,type){
  const host=qs('#toast-host'); const el=document.createElement('div');
  el.className='toast'+(type?' '+type:''); el.textContent=msg;
  host.appendChild(el); setTimeout(()=>el.remove(),4200);
}
function statusLabel(s){ return s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function placeholderThumb(){ return `<div class="row-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--text-faint);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8.5" cy="10" r="1.4"/><path d="M21 16l-5.2-5.2a1.5 1.5 0 0 0-2.1 0L4 20"/></svg></div>`; }

/* =========================================================
   AUTH
   ========================================================= */
async function checkSession(){
  const { data } = await supabaseC.auth.getSession();
  state.session = data.session;
  if(state.session){ showDashboard(); } else { showLogin(); }
}
supabaseC.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(session && qs('#dashboard-view').style.display==='none'){ showDashboard(); }
  if(!session){ showLogin(); }
});
function showLogin(){
  qs('#login-view').style.display='flex';
  qs('#dashboard-view').style.display='none';
}
async function showDashboard(){
  qs('#login-view').style.display='none';
  qs('#dashboard-view').style.display='block';
  qs('#admin-email').textContent = state.session.user.email;
  renderSideNav();
  qs('#admin-content').innerHTML = `<div class="loading-row">Loading store data…</div>`;
  await loadAll();
  applyBrandName();
  renderRoute();
}
qs('#login-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = qs('#login-btn'); btn.disabled=true; btn.textContent='Signing In…';
  qs('#login-error').classList.remove('show');
  const { error } = await supabaseC.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
  btn.disabled=false; btn.textContent='Sign In';
  if(error){ qs('#login-error').textContent = error.message; qs('#login-error').classList.add('show'); }
});
qs('#logout-btn').addEventListener('click', ()=>supabaseC.auth.signOut());
qs('#sidebar-toggle').addEventListener('click', ()=>qs('#sidebar').classList.toggle('open'));

/* =========================================================
   DATA LOADING (admin sees everything, not just active/public rows)
   ========================================================= */
async function loadAll(){
  const [cats, models, prods, orders, pay, store, news] = await Promise.all([
    supabaseC.from('categories').select('*').order('sort_order'),
    supabaseC.from('bike_models').select('*').order('model'),
    supabaseC.from('products').select('*, categories(id,name,slug), product_media(id,url,storage_path,media_type,sort_order), product_fitments(id,bike_model_id)').order('created_at',{ascending:false}),
    supabaseC.from('orders').select('*, order_items(*)').order('created_at',{ascending:false}),
    supabaseC.from('payment_settings').select('*').order('sort_order'),
    supabaseC.from('store_settings').select('*').eq('id',1).maybeSingle(),
    supabaseC.from('newsletter_subscribers').select('*').order('created_at',{ascending:false}),
  ]);
  state.categories = cats.data||[]; state.bikeModels = models.data||[]; state.products = prods.data||[];

function wireProductMediaControls(productId){
  const drop = qs('#product-file-drop');
  if(drop){
    drop.addEventListener('click', ()=>qs('#product-file-input').click());
    qs('#product-file-input').addEventListener('change', e=>{
      if(e.target.files.length) uploadProductMedia(productId, Array.from(e.target.files));
    });

async function submitProductForm(e){
  e.preventDefault();
  const form = e.target;
  const id = form.dataset.productId;
  const fd = new FormData(form);
  const name = fd.get('name');
  const payload = {
    name, slug: slugify(name)+'-'+Math.random().toString(36).slice(2,6),
    sku: fd.get('sku')||null,
    category_id: fd.get('category_id')||null,
    price: +fd.get('price'),
    compare_at_price: fd.get('compare_at_price')?+fd.get('compare_at_price'):null,
    stock_quantity: +fd.get('stock_quantity')||0,
    description: fd.get('description')||'',
    is_active: fd.get('is_active')==='on',
    is_featured: fd.get('is_featured')==='on',
    updated_at: new Date().toISOString(),
  };
  const btn = form.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    let row;
    if(id){
      delete payload.slug; // keep original slug on edit
      const { data, error } = await supabaseC.from('products').update(payload).eq('id', id).select('*, categories(id,name,slug), product_media(id,url,storage_path,media_type,sort_order), product_fitments(id,bike_model_id)').single();
      if(error) throw error; row = data;
      toast('Product updated.','success');
    } else {
      const { data, error } = await supabaseC.from('products').insert(payload).select('*, categories(id,name,slug), product_media(id,url,storage_path,media_type,sort_order), product_fitments(id,bike_model_id)').single();
      if(error) throw error; row = data;
      toast('Product created — add photos and fitment below.','success');
    }
    await loadAll();
    const fresh = state.products.find(p=>p.id===row.id) || row;
    qs('#modal-card').innerHTML = productModalBody(fresh);
    qs('#product-form').dataset.productId = fresh.id;
    qs('#product-form').addEventListener('submit', submitProductForm);
    wireProductMediaControls(fresh.id);
    renderProducts(qs('#admin-content'));
  }catch(err){ console.error(err); toast('Could not save product: '+err.message,'error'); }
  finally{ btn.disabled=false; }
}
async function uploadProductMedia(productId, files){
  for(const file of files){
    const isVideo = file.type.startsWith('video/');
    const path = `products/${productId}/${Date.now()}-${slugify(file.name)}`;
    const { error: upErr } = await supabaseC.storage.from('public-media').upload(path, file);
    if(upErr){ toast('Upload failed: '+upErr.message,'error'); continue; }
    const { data: pub } = supabaseC.storage.from('public-media').getPublicUrl(path);
    await supabaseC.from('product_media').insert({ product_id: productId, url: pub.publicUrl, storage_path: path, media_type: isVideo?'video':'image', sort_order:0 });
  }
  await loadAll();
  const fresh = state.products.find(p=>p.id===productId);
  qs('#modal-card').innerHTML = productModalBody(fresh);
  qs('#product-form').dataset.productId = fresh.id;
  qs('#product-form').addEventListener('submit', submitProductForm);
  wireProductMediaControls(fresh.id);
  renderProducts(qs('#admin-content'));
  toast('Media uploaded.','success');
}
async function deleteProductMedia(mediaId, storagePath, productId){
  try{
    await supabaseC.storage.from('public-media').remove([storagePath]);
    await supabaseC.from('product_media').delete().eq('id', mediaId);
    await loadAll();
    const fresh = state.products.find(p=>p.id===productId);
    qs('#modal-card').innerHTML = productModalBody(fresh);
    qs('#product-form').dataset.productId = fresh.id;
    qs('#product-form').addEventListener('submit', submitProductForm);
    wireProductMediaControls(fresh.id);
    renderProducts(qs('#admin-content'));
  }catch(err){ console.error(err); toast('Could not remove media.','error'); }
}
async function toggleFitment(productId, bikeModelId, checked){
  try{
    if(checked) await supabaseC.from('product_fitments').insert({ product_id: productId, bike_model_id: bikeModelId });
    else await supabaseC.from('product_fitments').delete().eq('product_id', productId).eq('bike_model_id', bikeModelId);
    await loadAll();
    renderProducts(qs('#admin-content'));
  }catch(err){ console.error(err); toast('Could not update fitment.','error'); }
}
async function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.')) return;
  try{
    await supabaseC.from('products').delete().eq('id', id);
    await loadAll();
    renderProducts(qs('#admin-content'));
    toast('Product deleted.','success');
  }catch(err){ console.error(err); toast('Could not delete product.','error'); }
}

  <form id="model-form">
    <div class="modal-body">
      <div class="field"><label>Make</label><input name="make" value="${esc(m?.make||'Harley-Davidson')}"></div>
      <div class="field"><label>Model *</label><input name="model" required value="${esc(m?.model||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Year Start *</label><input name="year_start" type="number" required value="${m?.year_start??''}"></div>
        <div class="field"><label>Year End (blank = current)</label><input name="year_end" type="number" value="${m?.year_end??''}"></div>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Close</button><button type="submit" class="btn btn-brass">${m?'Save Changes':'Create Model'}</button></div>
  </form>`;
}
function openModelModal(m){
  openModal(modelModalBody(m));
  qs('#model-form').dataset.modelId = m?.id||'';
  qs('#model-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const id = e.target.dataset.modelId;
    const fd = new FormData(e.target);
    const payload = { make: fd.get('make')||'Harley-Davidson', model: fd.get('model'), year_start: +fd.get('year_start'), year_end: fd.get('year_end')?+fd.get('year_end'):null };
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true;
    try{
      if(id){ const { error } = await supabaseC.from('bike_models').update(payload).eq('id', id); if(error) throw error; toast('Model updated.','success'); }
      else { const { error } = await supabaseC.from('bike_models').insert(payload); if(error) throw error; toast('Model created.','success'); }
      await loadAll(); closeModal(); renderBikeModels(qs('#admin-content'));
    }catch(err){ console.error(err); toast('Could not save model: '+err.message,'error'); btn.disabled=false; }
  });
}
async function deleteModel(id){
  if(!confirm('Delete this bike model? It will be removed from any product fitments.')) return;
  try{ await supabaseC.from('bike_models').delete().eq('id', id); await loadAll(); renderBikeModels(qs('#admin-content')); toast('Model deleted.','success'); }
  catch(err){ console.error(err); toast('Could not delete model.','error'); }
}

/* =========================================================
   VIEW: ORDERS
   ========================================================= */
function renderOrders(c, orderId){
  if(orderId) return renderOrderDetail(c, orderId);
  c.innerHTML = `

      <div class="panel-head">
        <h2>Orders (${state.orders.length})</h2>
        <select id="order-status-filter" style="background:var(--surface-2);border:1px solid var(--border-light);color:var(--text);padding:8px 10px;border-radius:var(--radius);">
          <option value="">All Statuses</option>
          ${STATUS_OPTS.map(s=>`<option value="${s}">${statusLabel(s)}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Method</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table></div>
    </div>`;
  function draw(filter){
    const list = filter ? state.orders.filter(o=>o.status===filter) : state.orders;
    qs('#orders-tbody').innerHTML = list.length===0?`<tr class="empty-row"><td colspan="6">No orders match.</td></tr>`:list.map(o=>`
      <tr style="cursor:pointer;" onclick="location.hash='#/orders/${o.id}'">
        <td class="mono">${esc(o.order_number)}</td><td>${esc(o.customer_name)}</td><td class="mono">${money(o.total)}</td>

        <td class="mono" style="color:var(--text-faint);">${fmtDate(o.created_at)}</td>
      </tr>`).join('');
  }
  draw('');
  qs('#order-status-filter').addEventListener('change', e=>draw(e.target.value));
}
function renderOrderDetail(c, orderId){

  c.innerHTML = `
    <a href="#/orders" style="color:var(--text-faint);font-size:12.5px;">← All Orders</a>
    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:14px;align-items:start;">
      <div class="panel" style="padding:22px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
          <div><div class="mono" style="color:var(--brass-light);font-size:20px;">${esc(o.order_number)}</div><div style="color:var(--text-faint);font-size:12px;">${fmtDateTime(o.created_at)}</div></div>
          <span class="badge badge-${STATUS_BADGE[o.status]}" style="font-size:12px;padding:6px 12px;">${statusLabel(o.status)}</span>
        </div>
        <table style="margin-bottom:10px;">
          <thead><tr><th>Item</th><th>Qty</th><th>Total</th></tr></thead>
          <tbody>${(o.order_items||[]).map(i=>`<tr><td>${esc(i.product_name)}<div class="mono" style="color:var(--text-faint);font-size:11px;">${esc(i.sku||'')}</div></td><td>${i.quantity}</td><td class="mono">${money(i.line_total)}</td></tr>`).join('')}</tbody>
        </table>
        <div style="text-align:right;padding:12px 20px;">
          <div style="color:var(--text-dim);">Subtotal: <span class="mono">${money(o.subtotal)}</span></div>
          ${o.discount_amount>0?`<div style="color:var(--success);">Discount: <span class="mono">−${money(o.discount_amount)}</span></div>`:''}
          <div style="font-weight:700;font-size:17px;margin-top:6px;">Total: <span class="mono">${money(o.total)}</span></div>
        </div>
      </div>
      <div>
        <div class="panel" style="padding:20px;margin-bottom:16px;">
          <h3 style="font-size:14px;text-transform:uppercase;margin-bottom:12px;">Customer</h3>
          <div style="font-size:13.5px;line-height:1.8;">
            <div>${esc(o.customer_name)}</div><div>${esc(o.customer_email)}</div><div>${esc(o.customer_phone||'—')}</div>
            <div style="margin-top:8px;color:var(--text-dim);">${esc(o.shipping_address)}<br>${esc(o.shipping_city||'')} ${esc(o.shipping_region||'')} ${esc(o.shipping_postal_code||'')}<br>${esc(o.shipping_country||'')}</div>
          </div>
        </div>
        <div class="panel" style="padding:20px;margin-bottom:16px;">
          <h3 style="font-size:14px;text-transform:uppercase;margin-bottom:12px;">Payment</h3>
          <div style="font-size:13.5px;"><div>Method: <strong>${esc(method?method.display_name:o.payment_method)}</strong></div>
          ${o.payment_reference?`<div>Reference: <span class="mono">${esc(o.payment_reference)}</span></div>`:''}
          <div id="proof-holder" style="margin-top:10px;"></div>
          </div>
        </div>
        <div class="panel" style="padding:20px;">
          <h3 style="font-size:14px;text-transform:uppercase;margin-bottom:12px;">Update Status</h3>
          <div class="field"><select id="status-select">${STATUS_OPTS.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Admin Notes</label><textarea id="admin-notes">${esc(o.admin_notes||'')}</textarea></div>
          <button class="btn btn-brass btn-block" id="save-status-btn">Save</button>
        </div>
      </div>
    </div>`;
  if(o.payment_proof_url) loadProofImage(o.payment_proof_url);
  qs('#save-status-btn').addEventListener('click', async ()=>{
    const btn = qs('#save-status-btn'); btn.disabled=true; btn.textContent='Saving…';
    try{
      const { error } = await supabaseC.from('orders').update({ status: qs('#status-select').value, admin_notes: qs('#admin-notes').value, updated_at: new Date().toISOString() }).eq('id', o.id);
      if(error) throw error;
      await loadAll(); toast('Order updated.','success'); renderOrderDetail(qs('#admin-content'), orderId);
    }catch(err){ console.error(err); toast('Could not update order.','error'); btn.disabled=false; btn.textContent='Save'; }

}
async function loadProofImage(path){
  try{
    const { data, error } = await supabaseC.storage.from('payment-proofs').createSignedUrl(path, 3600);
    if(error) throw error;
    const holder = qs('#proof-holder');
    if(holder) holder.innerHTML = `<a href="${data.signedUrl}" target="_blank"><img src="${data.signedUrl}" style="max-width:100%;border-radius:4px;border:1px solid var(--border);"></a>`;
  }catch(err){ console.error(err); }
}

/* =========================================================
   VIEW: CUSTOMERS (derived from orders)
   ========================================================= */
function deriveCustomers(){
  const map = new Map();
  state.orders.forEach(o=>{
    const key = o.customer_email;
    if(!map.has(key)) map.set(key, { name:o.customer_name, email:key, phone:o.customer_phone, orders:0, total:0, last:o.created_at });
    const cust = map.get(key);
    cust.orders += 1;
    if(o.status!=='cancelled') cust.total += +o.total;
    if(new Date(o.created_at) > new Date(cust.last)) cust.last = o.created_at;
  });
  return Array.from(map.values()).sort((a,b)=>b.total-a.total);
}
function renderCustomers(c){
  const customers = deriveCustomers();
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Customers (${customers.length})</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total Spent</th><th>Last Order</th></tr></thead>
        <tbody>
          ${customers.length===0?`<tr class="empty-row"><td colspan="6">No customers yet — they'll appear here after the first order.</td></tr>`:customers.map(cu=>`
          <tr><td style="font-weight:600;">${esc(cu.name)}</td><td>${esc(cu.email)}</td><td>${esc(cu.phone||'—')}</td><td>${cu.orders}</td><td class="mono">${money(cu.total)}</td><td class="mono" style="color:var(--text-faint);">${fmtDate(cu.last)}</td></tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

/* =========================================================
   VIEW: PAYMENT SETTINGS
   ========================================================= */
function renderPaymentSettings(c){
  c.innerHTML = `
    <p class="section-note">These power the payment screen at checkout. Turn a method off to hide it from customers.</p>
    <div style="display:grid;gap:14px;">
      ${state.paymentMethods.map(m=>paymentMethodCard(m)).join('')}
    </div>`;
  qsa('.pm-save').forEach(btn=>btn.addEventListener('click', ()=>savePaymentMethod(btn.dataset.method)));
  qsa('.pm-toggle').forEach(t=>t.addEventListener('change', e=>quickTogglePayment(e.target.dataset.method, e.target.checked)));
}
function paymentMethodCard(m){
  const fields = PAYMENT_FIELD_MAP[m.method]||[];
  const details = m.account_details||{};
  return `
  <div class="panel" style="padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h3 style="font-size:16px;text-transform:uppercase;">${esc(m.display_name)}</h3>
      <label class="toggle"><input type="checkbox" class="pm-toggle" data-method="${m.method}" ${m.is_active?'checked':''}><span class="track"></span></label>
    </div>
    <div class="field-row">
      <div class="field"><label>Display Name</label><input data-f="display_name" value="${esc(m.display_name)}"></div>
      <div class="field"><label>Discount % (0 = none)</label><input data-f="discount_percent" type="number" step="0.1" min="0" value="${m.discount_percent}"></div>
    </div>
    <div class="field"><label>Instructions shown to customer</label><textarea data-f="instructions">${esc(m.instructions||'')}</textarea></div>
    <div class="field-row">
      ${fields.map(([key,label])=>`<div class="field"><label>${esc(label)}</label><input data-detail="${key}" value="${esc(details[key]||'')}"></div>`).join('')}
    </div>
    <div class="field">
      <label>QR Code (optional)</label>
      ${m.qr_code_url?`<div class="media-grid" style="grid-template-columns:80px;margin-bottom:8px;"><div class="media-thumb"><img src="${esc(m.qr_code_url)}"></div></div>`:''}
      <div class="file-drop" data-qr-drop="${m.method}">Click to upload QR image<input type="file" accept="image/*" style="display:none;" data-qr-input="${m.method}"></div>
    </div>
    <button class="btn btn-brass pm-save" data-method="${m.method}" style="margin-top:8px;">Save ${esc(m.display_name)}</button>
  </div>`;
}
document.addEventListener('click', e=>{
  const drop = e.target.closest('[data-qr-drop]');
  if(drop) qs(`[data-qr-input="${drop.dataset.qrDrop}"]`).click();
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-qr-input]')){
    const method = e.target.dataset.qrInput;
    const file = e.target.files[0];
    if(file) uploadPaymentQr(method, file);
  }
});
async function uploadPaymentQr(method, file){
  try{
    const path = `payment-qr/${method}-${Date.now()}-${slugify(file.name)}`;
    const { error: upErr } = await supabaseC.storage.from('public-media').upload(path, file);
    if(upErr) throw upErr;
    const { data: pub } = supabaseC.storage.from('public-media').getPublicUrl(path);
    const { error } = await supabaseC.from('payment_settings').update({ qr_code_url: pub.publicUrl }).eq('method', method);
    if(error) throw error;
    await loadAll(); renderPaymentSettings(qs('#admin-content')); toast('QR code uploaded.','success');
  }catch(err){ console.error(err); toast('Could not upload QR code.','error'); }
}
async function quickTogglePayment(method, checked){
  try{ await supabaseC.from('payment_settings').update({ is_active: checked }).eq('method', method); await loadAll(); }
  catch(err){ console.error(err); toast('Could not update.','error'); }
}
async function savePaymentMethod(method){
  const card = [...qsa('.panel')].find(p=>p.querySelector(`[data-method="${method}"]`));
  const payload = { display_name: card.querySelector('[data-f="display_name"]').value, discount_percent: +card.querySelector('[data-f="discount_percent"]').value||0, instructions: card.querySelector('[data-f="instructions"]').value };
  const details = {};
  card.querySelectorAll('[data-detail]').forEach(inp=>{ details[inp.dataset.detail] = inp.value; });
  payload.account_details = details;
  try{
    const { error } = await supabaseC.from('payment_settings').update(payload).eq('method', method);
    if(error) throw error;
    await loadAll(); toast(payload.display_name+' saved.','success'); renderPaymentSettings(qs('#admin-content'));
  }catch(err){ console.error(err); toast('Could not save: '+err.message,'error'); }
}

/* =========================================================
   VIEW: NEWSLETTER
   ========================================================= */

    <div class="panel">
      <div class="panel-head"><h2>Newsletter Subscribers (${state.newsletter.length})</h2>

        <thead><tr><th>Email</th><th>Subscribed</th></tr></thead>
        <tbody>${state.newsletter.length===0?`<tr class="empty-row"><td colspan="2">No subscribers yet.</td></tr>`:state.newsletter.map(n=>`<tr><td>${esc(n.email)}</td><td class="mono" style="color:var(--text-faint);">${fmtDate(n.created_at)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  qs('#export-csv').addEventListener('click', ()=>{
    const csv = 'email,subscribed_at\n'+state.newsletter.map(n=>`${n.email},${n.created_at}`).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='newsletter-subscribers.csv'; a.click();

}

/* =========================================================
   VIEW: STORE SETTINGS
   ========================================================= */
function renderStoreSettings(c){
  const s = state.storeSettings;
  c.innerHTML = `
    <div class="panel" style="padding:22px;max-width:600px;">
      <div class="field"><label>Store Name</label><input id="ss-name" value="${esc(s.store_name||'')}"></div>
      <div class="field"><label>Tagline</label><input id="ss-tagline" value="${esc(s.tagline||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Contact Email</label><input id="ss-email" value="${esc(s.contact_email||'')}"></div>
        <div class="field"><label>Contact Phone</label><input id="ss-phone" value="${esc(s.contact_phone||'')}"></div>
      </div>
      <div class="field"><label>WhatsApp Number (digits only, with country code)</label><input id="ss-whatsapp" value="${esc(s.contact_whatsapp||'')}" placeholder="e.g. 1960239880"></div>
      <div class="field"><label>Address</label><textarea id="ss-address">${esc(s.address||'')}</textarea></div>
      <div class="field">
        <label>Logo</label>
        ${s.logo_url?`<div class="media-grid" style="grid-template-columns:90px;margin-bottom:8px;"><div class="media-thumb"><img src="${esc(s.logo_url)}"></div></div>`:''}
        <div class="file-drop" id="logo-drop">Click to upload a logo<input type="file" id="logo-input" accept="image/*" style="display:none;"></div>
      </div>
      <button class="btn btn-brass" id="save-settings-btn" style="margin-top:8px;">Save Store Settings</button>
    </div>`;
  let pendingLogo = null;
  qs('#logo-drop').addEventListener('click', ()=>qs('#logo-input').click());
  qs('#logo-input').addEventListener('change', e=>{ pendingLogo = e.target.files[0]||null; if(pendingLogo) qs('#logo-drop').textContent = pendingLogo.name; });
  qs('#save-settings-btn').addEventListener('click', async ()=>{
    const btn = qs('#save-settings-btn'); btn.disabled=true; btn.textContent='Saving…';
    try{
      const payload = { store_name: qs('#ss-name').value, tagline: qs('#ss-tagline').value, contact_email: qs('#ss-email').value, contact_phone: qs('#ss-phone').value, contact_whatsapp: qs('#ss-whatsapp').value, address: qs('#ss-address').value };
      if(pendingLogo){
        const path = `branding/logo-${Date.now()}-${slugify(pendingLogo.name)}`;
        const { error: upErr } = await supabaseC.storage.from('public-media').upload(path, pendingLogo);
        if(!upErr){ const { data: pub } = supabaseC.storage.from('public-media').getPublicUrl(path); payload.logo_url = pub.publicUrl; }
      }
      const { error } = await supabaseC.from('store_settings').update(payload).eq('id',1);
      if(error) throw error;
      await loadAll(); applyBrandName(); toast('Store settings saved.','success');
      btn.disabled=false; btn.textContent='Save Store Settings';
    }catch(err){ console.error(err); toast('Could not save: '+err.message,'error'); btn.disabled=false; btn.textContent='Save Store Settings'; }
  });
}

/* =========================================================
   GLOBAL CLICK DELEGATION
   ========================================================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  if(a==='new-product') openProductModal(null);
  if(a==='edit-product') openProductModal(state.products.find(p=>p.id===t.dataset.id));
  if(a==='delete-product') deleteProduct(t.dataset.id);
  if(a==='new-category') openCategoryModal(null);
  if(a==='edit-category') openCategoryModal(state.categories.find(x=>x.id===t.dataset.id));
  if(a==='delete-category') deleteCategory(t.dataset.id);
  if(a==='new-model') openModelModal(null);
  if(a==='edit-model') openModelModal(state.bikeModels.find(x=>x.id===t.dataset.id));
  if(a==='delete-model') deleteModel(t.dataset.id);
  if(a==='delete-media') deleteProductMedia(t.dataset.id, t.dataset.path, qs('#product-form').dataset.productId);
  if(a==='toggle-fitment') toggleFitment(qs('#product-form').dataset.productId, t.dataset.model, t.checked);
});

/* =========================================================
   INIT
   ========================================================= */
checkSession();
</script>
